<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Yailin Business</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <button
            class="menu-button"
            aria-label="Open menu"
            onclick="document.querySelector('.site-menu').classList.add('open')"
        >
            ☰
        </button>

        <a class="brand" href="index.html">
            Yailin Business
        </a>

        <a class="cart-button" href="shop.html" aria-label="View shop">
            🛒
        </a>
    </header>

    <nav class="site-menu">
        <button
            class="close-menu"
            aria-label="Close menu"
            onclick="document.querySelector('.site-menu').classList.remove('open')"
        >
            ×
        </button>

        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <section class="contact-page">
            <p class="contact-label">
                Get in Touch
            </p>

            <h1>Contact</h1>

            <p class="contact-text">
                Have a question about an order or our menu?
                Reach out through Instagram or TikTok.
            </p>

            <div class="contact-info">
                <div class="contact-item">
                    <h2>Instagram</h2>
                    <p>Handle coming soon</p>
                </div>

                <div class="contact-item">
                    <h2>TikTok</h2>
                    <p>Handle coming soon</p>
                </div>
            </div>

            <a class="contact-shop-button" href="shop.html">
                Shop & Order
            </a>
        </section>
    </main>
</body>
</html>
